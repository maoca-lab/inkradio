name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取回專案檔案
        uses: actions/checkout@v4
      - name: 清理舊編譯緩存
        run: rm -rf .buildozer bin

      - name: 用 Buildozer 編譯 APK
        id: build
        run: |
          docker run --rm \
            -v "$PWD":/home/user/host \
            -w /home/user/host \
            kivy/buildozer:latest \
            android debug

      - name: 上傳產出的 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: inkradio-apk
          path: ./bin/*.apk

      - name: 失敗診斷：顯示關鍵錯誤
        if: failure()
        run: |
          echo "===== buildozer.log 關鍵錯誤（含 error/fail/exception 的行）====="
          if [ -f buildozer.log ]; then
            grep -iE "error|fail|exception|traceback|could not|unable|fatal|BUILD FAILED" buildozer.log | tail -n 60
            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log          echo "===== buildozer.log 關鍵錯誤（含 error/fail/exception 的行）====="
          if [ -f buildozer.log ]; then
            grep -iE "error|fail|exception|traceback|could not|unable|fatal|BUILD FAILED" buildozer.log | tail -n 60
            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log          echo "===== buildozer.log 關鍵錯誤（含 error/fail/exception 的行）====="
          if [ -f buildozer.log ]; then
