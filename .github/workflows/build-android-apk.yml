name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 取回專案程式碼
      - name: 取回專案檔案
        uses: actions/checkout@v4

      # 2. 新增：清理舊編譯快取與輸出檔 (確保語法縮排為 2 個空格)
      - name: 清理舊編譯快取
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 3. 設定 Python 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. 安裝系統依賴套件
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake build-essential libssl-dev libffi-dev
          pip install --upgrade pip
          pip install buildozer cython

      # 5. 執行 Buildozer 打包
      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      # 6. 上傳 Buildozer 日誌附件 (方便排錯)
      - name: Upload Buildozer Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      # 7. 上傳生成好的 APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
          if [ -f buildozer.log ]; then
            grep -iE "error|fail|exception|traceback|could not|unable|fatal|BUILD FAILED" buildozer.log | tail -n 60
            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log          echo "===== buildozer.log 關鍵錯誤（含 error/fail/exception 的行）====="
          if [ -f buildozer.log ]; then
            grep -iE "error|fail|exception|traceback|could not|unable|fatal|BUILD FAILED" buildozer.log | tail -n 60
            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log          echo "===== buildozer.log 關鍵錯誤（含 error/fail/exception 的行）====="
          if [ -f buildozer.log ]; then
            grep -iE "error|fail|exception|traceback|could not|unable|fatal|BUILD FAILED" buildozer.log | tail -n 60
            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log          echo "===== buildozer.log 關鍵錯誤（含 error/fail/exception 的行）====="
          if [ -f buildozer.log ]; then
            grep -iE "error|fail|exception|traceback|could not|unable|fatal|BUILD FAILED" buildozer.log | tail -n 60
            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log            echo ""
            echo "===== buildozer.log 最後 100 行 ====="
            tail -n 100 buildozer.log
          else
            echo "未找到 buildozer.log，編譯可能尚未開始。"
          fi

      - name: 上傳 buildozer 完整日志（供下載排查）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
