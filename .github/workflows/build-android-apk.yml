# .github/workflows/build-android-apk.yml
# ==========================================
# 水墨電台 - GitHub Actions 自動化打包工作流 (標準精簡版)
# ==========================================
name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. 取回專案程式碼
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 清理舊編譯快取與暫存
      - name: Clean build cache
        run: |
          rm -rf .buildozer
          rm -rf bin

      # 3. 設定 Python 3.10 環境
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. 安裝 Linux 系統依賴與 Buildozer
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake build-essential libssl-dev libffi-dev
          pip install --upgrade pip
          pip install buildozer cython

      # 5. 執行 Buildozer 打包 APK
      - name: Build with Buildozer
        run: |
          buildozer -v android debug

      # 6. 上傳 Buildozer 日誌附件 (不論成功或失敗皆執行)
      - name: Upload Buildozer Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log

      # 7. 上傳產出的 APK 安裝包
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: bin/*.apk
